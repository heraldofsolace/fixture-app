<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Issue Kanban</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <h1>Issue Kanban</h1>
        <p class="subtitle" id="repo">loading&hellip;</p>
      </div>
      <div class="topbar-actions">
        <span class="stamp" id="stamp"></span>
        <button id="refresh" type="button">Refresh</button>
      </div>
    </header>

    <main id="board" class="board" aria-busy="true">
      <section class="column" id="column-todo">
        <header class="column-head">
          <h2>To Do</h2>
          <span class="count" data-role="count">0</span>
        </header>
        <ul class="cards" data-role="cards"></ul>
      </section>

      <section class="column" id="column-inProgress">
        <header class="column-head">
          <h2>In Progress</h2>
          <span class="count" data-role="count">0</span>
        </header>
        <ul class="cards" data-role="cards"></ul>
      </section>
    </main>

    <p class="status" id="status" role="status" aria-live="polite"></p>

    <script type="module" src="/app.js"></script>
  </body>
</html>
